name: API regression (Newman)

on:
  # Run when the collection or this workflow changes on main.
  push:
    branches: [main]
    paths:
      - "collections/**"
      - ".github/workflows/newman.yml"
  # Run manually: Actions -> API regression (Newman) -> Run workflow.
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  newman:
    name: Run Petstore CRUD collection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Newman 6
        run: npm install -g newman@6

      - name: Show versions
        run: |
          node --version
          newman --version

      - name: Run collection
        # Newman exits with a non-zero code when any assertion fails,
        # so a failed test makes this step (and the run) red.
        run: >
          newman run collections/petstore-collection.json
          --reporters cli,json
          --reporter-json-export results/newman-report.json

      - name: Upload JSON report
        # always(): upload the report also when the run failed —
        # that is exactly when it is needed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-json-report
          path: results/newman-report.json
          if-no-files-found: warn
          retention-days: 30
